default_joint_angles: # The default joint angles for the robot
  right_hip_pitch_joint: -0.1
  left_hip_pitch_joint: -0.1
  right_knee_joint: 0.3
  left_knee_joint: 0.3
  right_ankle_joint: -0.2
  left_ankle_joint: -0.2
fix_joints: # Joints which is fixed during experiment
  - left_shoulder_pitch_joint
  - right_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - right_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - right_shoulder_yaw_joint
  - left_elbow_joint
  - right_elbow_joint
  - torso_joint
hip_joints:
  - right_hip_yaw_joint
  - right_hip_roll_joint
  - right_hip_pitch_joint
  - left_hip_yaw_joint
  - left_hip_roll_joint
  - left_hip_pitch_joint
knee_joints:
  - right_knee_joint
  - left_knee_joint
foot_links: # Links which are considered as feet
  - left_ankle_link
  - right_ankle_link
friction: 5.0 # Friction coefficient for the robot
pd_controller:
  kp: 100.0 # Proportional gain for the PD controller
  # See also https://github.com/unitreerobotics/unitree_rl_gym/blob/276801e46c5d433564f24658bac64f254b7d2d4b/legged_gym/envs/h1_2/h1_2_config.py#L48-L53
  kp_values:
    right_hip_yaw_joint: 150.0
    right_hip_roll_joint: 150.0
    right_hip_pitch_joint: 150.0
    right_knee_joint: 300.0
    right_ankle_pitch_joint: 40.0
    right_ankle_roll_joint: 40.0
    left_hip_yaw_joint: 150.0
    left_hip_roll_joint: 150.0
    left_hip_pitch_joint: 150.0
    left_knee_joint: 300.0
    left_ankle_pitch_joint: 40.0
    left_ankle_roll_joint: 40.0
    torso: 300.0
  kd: 0.0 # Derivative gain for the PD controller
  # See also https://github.com/unitreerobotics/unitree_rl_gym/blob/276801e46c5d433564f24658bac64f254b7d2d4b/legged_gym/envs/h1_2/h1_2_config.py#L56C1-L61C37
  kd_values:
    right_hip_yaw_joint: 2.0
    right_hip_roll_joint: 2.0
    right_hip_pitch_joint: 2.0
    right_knee_joint: 4.0
    right_ankle_pitch_joint: 2.0
    right_ankle_roll_joint: 2.0
    left_hip_yaw_joint: 2.0
    left_hip_roll_joint: 2.0
    left_hip_pitch_joint: 2.0
    left_knee_joint: 4.0
    left_ankle_pitch_joint: 2.0
    left_ankle_roll_joint: 2.0
base_init_pos: [0.0, 0.0, 1.1] # Initial position of the robot base
base_init_quat: [1.0, 0.0, 0.0, 0.0] # Initial orientation of the robot base
episode_length_seconds: 20.0 # Length of the episode in seconds
resampling_time_seconds: 8 # Time between resampling the action
action_scale: 0.25 # Scale for the action space
simulate_action_latency: true # Whether to simulate action latency
clip_action: 100.0 # Clip the action to a certain range
reward_config:
  only_positive_rewards: true
termination_if_roll_greater_than: 30.0
termination_if_pitch_greater_than: 30.0
